name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint-and-validate:
    name: Lint and Validate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff black

    - name: Run ruff linter
      working-directory: ./backend
      run: |
        # Check for errors and warnings
        ruff check . --select E,W,F --ignore E501
      continue-on-error: true

    - name: Check code formatting with black
      working-directory: ./backend
      run: |
        black --check --diff .
      continue-on-error: true

    - name: Validate Python imports
      working-directory: ./backend
      run: |
        python -c "
        import sys
        import importlib.util

        files = ['main.py', 'agent.py', 'session.py', 'tools.py', 'models.py', 'config.py']
        failed = []

        for file in files:
            spec = importlib.util.spec_from_file_location('module', file)
            if spec is None:
                failed.append(file)
                continue
            try:
                module = importlib.util.module_from_spec(spec)
                spec.loader.exec_module(module)
                print(f'✓ {file}')
            except Exception as e:
                print(f'✗ {file}: {e}')
                failed.append(file)

        if failed:
            print(f'\nFailed to import: {failed}')
            sys.exit(1)
        else:
            print('\n✓ All modules import successfully')
        "

